<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shaka Player - ClearKey DRM Tester</title>
    <!-- Cargamos Shaka Player desde su CDN oficial -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.1/shaka-player.compiled.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #121212;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .video-container {
            margin-top: 20px;
            width: 100%;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
        }
        .error { color: #ff4d4d; margin-top: 10px; font-weight: bold; }
        
        /* Nuevos estilos para los metadatos */
        .metadata-container {
            margin-top: 20px;
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 15px;
            display: none; /* Se oculta hasta que cargue el video */
        }
        .metadata-container h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #007bff;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }
        .metadata-item {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .metadata-item strong {
            color: #bbb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Tester de DRM ClearKey</h2>
    
    <div class="form-group">
        <label for="videoUrl">URL del Manifiesto (HLS .m3u8, DASH .mpd o Progressive .mp4)</label>
        <input type="text" id="videoUrl" placeholder="https://ejemplo.com/master_wv.m3u8">
    </div>

    <div class="form-group">
        <label for="drmKeys">Pares de Claves (Formato: keyid:key, keyid:key)</label>
        <input type="text" id="drmKeys" placeholder="ce4ce2ceace94606:clavehexadecimal, 1a2b3c4d5e:otraclave">
    </div>

    <button onclick="loadVideo()">Reproducir</button>
    <div id="errorMessage" class="error"></div>

    <div class="video-container">
        <video id="video" controls autoplay></video>
    </div>

    <!-- Contenedor donde se mostrarán los metadatos directamente -->
    <div id="metadataContainer" class="metadata-container"></div>
</div>

<script>
    let player;

    // Inicializar Shaka Player cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', () => {
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
            initPlayer();
        } else {
            document.getElementById('errorMessage').innerText = "Tu navegador no soporta Shaka Player.";
        }
    });

    function initPlayer() {
        const videoElement = document.getElementById('video');
        player = new shaka.Player(videoElement);

        // Escuchar errores internos del reproductor
        player.addEventListener('error', onErrorEvent);
    }

    async function loadVideo() {
        const url = document.getElementById('videoUrl').value.trim();
        const keysString = document.getElementById('drmKeys').value.trim();
        const errorDiv = document.getElementById('errorMessage');
        const metadataDiv = document.getElementById('metadataContainer');
        
        errorDiv.innerText = ""; // Limpiar errores previos
        metadataDiv.style.display = "none"; // Ocultar metadatos al cargar uno nuevo

        if (!url) {
            errorDiv.innerText = "Por favor, ingresa una URL válida.";
            return;
        }

        // Lógica para parsear la cadena de texto a un objeto { "keyid": "key" }
        const clearKeysConfig = {};
        if (keysString) {
            try {
                // Separar por comas
                const pairs = keysString.split(',');
                for (let pair of pairs) {
                    // Separar por dos puntos
                    const [kid, key] = pair.split(':');
                    if (kid && key) {
                        clearKeysConfig[kid.trim()] = key.trim();
                    }
                }
            } catch (e) {
                errorDiv.innerText = "Error al leer las claves. Verifica el formato keyid:key.";
                return;
            }
        }

        // Configurar el DRM en Shaka Player
        player.configure({
            drm: {
                clearKeys: clearKeysConfig
            }
        });

        // Intentar cargar la URL
        try {
            await player.load(url);
            console.log('El video se cargó correctamente.');
            
            // Una vez cargado, extraemos y mostramos los metadatos
            displayMetadata();
        } catch (e) {
            onError(e);
        }
    }

    function displayMetadata() {
        const metadataDiv = document.getElementById('metadataContainer');
        const variantTracks = player.getVariantTracks();
        const textTracks = player.getTextTracks();
        
        let resolutions = new Set();
        let audios = new Set();
        let codecs = new Set();
        let bandwidths = new Set();

        // Recorrer las pistas de video/audio
        variantTracks.forEach(track => {
            if (track.width && track.height) {
                resolutions.add(`${track.width}x${track.height}`);
            }
            if (track.language) {
                audios.add(track.language);
            }
            if (track.codecs) {
                codecs.add(track.codecs);
            }
            if (track.bandwidth) {
                // Convertir a Mbps para mejor legibilidad
                bandwidths.add((track.bandwidth / 1000000).toFixed(2) + ' Mbps');
            }
        });

        // Recorrer las pistas de texto (Subtítulos)
        let subtitles = new Set();
        textTracks.forEach(track => {
            if (track.language) {
                subtitles.add(track.language);
            }
        });

        // Si no detectó idioma pero hay audio, marcamos como "Original/Desconocido"
        if (audios.size === 0 && variantTracks.some(t => t.audioId !== null)) {
             audios.add('Original / No especificado');
        }

        // Construir el HTML para mostrar los metadatos
        let html = '<h3>Metadatos del Video</h3>';
        
        html += '<div class="metadata-item"><strong>Resoluciones:</strong> ' + 
                (resolutions.size > 0 ? Array.from(resolutions).join(' | ') : 'No disponible') + '</div>';
                
        html += '<div class="metadata-item"><strong>Audios (idiomas):</strong> ' + 
                (audios.size > 0 ? Array.from(audios).join(', ') : 'No disponible') + '</div>';
                
        html += '<div class="metadata-item"><strong>Subtítulos (idiomas):</strong> ' + 
                (subtitles.size > 0 ? Array.from(subtitles).join(', ') : 'Ninguno') + '</div>';
                
        html += '<div class="metadata-item"><strong>Codecs:</strong> ' + 
                (codecs.size > 0 ? Array.from(codecs).join(', ') : 'No disponible') + '</div>';
                
        html += '<div class="metadata-item"><strong>Bitrates:</strong> ' + 
                (bandwidths.size > 0 ? Array.from(bandwidths).join(' | ') : 'No disponible') + '</div>';
        
        // Obtener la duración directamente del elemento de video HTML5
        const video = document.getElementById('video');
        const duration = video.duration;
        html += '<div class="metadata-item"><strong>Duración:</strong> ' + 
                (duration && !isNaN(duration) && duration !== Infinity ? Math.floor(duration) + ' segundos' : 'En vivo / Desconocida') + '</div>';

        // Insertar en el DOM y hacer visible
        metadataDiv.innerHTML = html;
        metadataDiv.style.display = 'block';
    }

    function onErrorEvent(event) {
        onError(event.detail);
    }

    function onError(error) {
        console.error('Código de error:', error.code, 'Objeto completo:', error);
        document.getElementById('errorMessage').innerText = "Error al reproducir: Código " + error.code;
    }
</script>

</body>
</html>
